name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/CleanQuest-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CleanQuest-apk
          path: dist/*.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CleanQuest build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
          body: |
            Install on Android: download the APK below on your phone and open it
            (allow "install unknown apps" for your browser if asked).
